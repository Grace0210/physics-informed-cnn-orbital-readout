name: cnn-v3
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - pillow>=10
  - pip:
      # Official PyTorch wheel. On Apple Silicon it automatically uses MPS
      # when available; the scripts fall back to CUDA or CPU otherwise.
      - torch>=2.2
